<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bharath Bhoomi — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#FBF6EA; --cream-2:#F3ECD9; --leaf:#4A7C3C; --leaf-dark:#345B2A; --turmeric:#E8A93B; --soil:#5B3A24; --chili:#D2542E; --card:#FFFDF7; --ring: rgba(74,124,60,0.35); }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--cream); color:var(--soil); font-family:'Karla', sans-serif; }
  h1,h2{font-family:'Fredoka'; font-weight:600; color:var(--leaf-dark); margin:0 0 .3em;}
  .wrap{max-width:900px; margin:0 auto; padding:0 20px;}
  header{ position:sticky; top:0; background:rgba(251,246,234,0.95); border-bottom:2px solid var(--cream-2); z-index:10; }
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 20px;}
  .brandmark{display:flex; align-items:center; gap:10px; font-family:'Fredoka'; font-weight:700; color:var(--leaf-dark);}
  .brandmark .mk{width:32px;height:32px;border-radius:50%;background:var(--leaf); color:#fff; display:flex;align-items:center;justify-content:center; font-size:.75rem; font-weight:700;}
  .tabs{display:flex; gap:6px; overflow-x:auto; padding:0 20px 12px;}
  .tab{ flex:0 0 auto; padding:9px 16px; border-radius:100px; border:2px solid var(--cream-2); background:var(--card); font-weight:700; font-size:.9rem; }
  .tab.active{background:var(--leaf); color:#fff; border-color:var(--leaf);}
  main{padding:26px 0 80px;}
  .panel{display:none;} .panel.active{display:block;}
  .card{background:var(--card); border-radius:22px; padding:24px; box-shadow:0 8px 22px rgba(91,58,36,0.08); margin-bottom:20px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-weight:700; font-size:.85rem; color:var(--leaf-dark); margin-bottom:6px;}
  .field input, .field textarea{ width:100%; padding:11px 14px; border-radius:12px; border:2px solid var(--cream-2); background:var(--cream); color:var(--soil); font-size:.95rem; }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:640px){ .row2{grid-template-columns:1fr;} }
  .btn{display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:100px; font-weight:700; border:2px solid transparent; font-size:.92rem; cursor:pointer;}
  .btn-primary{background:var(--leaf); color:#fff;}
  .btn-ghost{background:transparent; border-color:var(--soil); color:var(--soil);}
  .btn-danger{background:transparent; border-color:var(--chili); color:var(--chili);}
  .btn-sm{padding:7px 14px; font-size:.82rem;}
  .save-note{font-size:.85rem; color:var(--leaf-dark); font-weight:700; margin-left:10px;}
  .item{display:flex; gap:14px; align-items:flex-start; padding:14px 0; border-bottom:1px solid var(--cream-2);}
  .item:last-child{border-bottom:none;}
  .item-body{flex:1; min-width:0;}
  .item-title{font-weight:700; font-family:'Fredoka'; color:var(--leaf-dark);}
  .item-sub{font-size:.85rem; color:#7a6650;}
  .empty{padding:26px; text-align:center; color:#8a7457; font-size:.92rem;}
  .tag-pill{display:inline-flex; align-items:center; gap:6px; background:var(--cream-2); padding:6px 12px; border-radius:100px; font-size:.85rem; font-weight:700; margin:4px 6px 0 0;}
  .tag-pill button{background:none; border:none; color:var(--chili); font-weight:700;}
  .gate{display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;}
  .gate-card{background:var(--card); border-radius:24px; padding:36px 28px; max-width:380px; width:100%; box-shadow:0 10px 26px rgba(91,58,36,0.1);}
  .photo-preview{width:100%; max-width:320px; aspect-ratio:4/3; object-fit:cover; border-radius:18px; border:6px solid var(--cream-2); margin-bottom:14px;}
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--soil); color:var(--cream); padding:12px 22px; border-radius:100px; font-weight:700; font-size:.88rem; opacity:0; pointer-events:none; transition:all .25s ease; }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .error-text{color:var(--chili); font-size:.85rem; margin-top:8px;}
</style>
</head>
<body>

<div id="gateScreen" class="gate">
  <div class="gate-card">
    <h2>🌱 Admin sign in</h2>
    <div class="field"><label>Username</label><input id="loginUser" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%; justify-content:center;">Sign in</button>
    <div class="error-text" id="loginError"></div>
  </div>
</div>

<div id="appRoot" style="display:none;">
<header>
  <div class="topbar wrap">
    <div class="brandmark"><span class="mk">BB</span> Bharath Bhoomi · Admin</div>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Sign out</button>
  </div>
  <div class="tabs wrap">
    <button class="tab active" data-tab="content">Content</button>
    <button class="tab" data-tab="photos">Photo</button>
    <button class="tab" data-tab="products">Products</button>
    <button class="tab" data-tab="customers">Customers</button>
    <button class="tab" data-tab="reports">Reports</button>
  </div>
</header>
<main class="wrap">
  <section class="panel active" id="panel-content">
    <div class="card">
      <h2>Hero section</h2>
      <div class="field"><label>Badge text</label><input id="c_badge"></div>
      <div class="field"><label>Headline</label><textarea id="c_heading" rows="2"></textarea></div>
      <div class="field"><label>Sub-text</label><textarea id="c_lead" rows="3"></textarea></div>
    </div>
    <div class="card">
      <h2>About section</h2>
      <div class="field"><label>Heading</label><input id="c_aboutHeading"></div>
      <div class="field"><label>Paragraph 1</label><textarea id="c_aboutP1" rows="3"></textarea></div>
      <div class="field"><label>Paragraph 2</label><textarea id="c_aboutP2" rows="3"></textarea></div>
      <div class="field">
        <label>Tags</label>
        <div id="tagList"></div>
        <div style="display:flex; gap:8px; margin-top:10px;">
          <input id="newTagInput" placeholder="Add a tag…" style="flex:1;">
          <button class="btn btn-ghost btn-sm" id="addTagBtn" type="button">Add</button>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>Contact details</h2>
      <div class="row2">
        <div class="field"><label>Location</label><input id="c_location"></div>
        <div class="field"><label>Email</label><input id="c_email"></div>
      </div>
      <div class="field"><label>Phone</label><input id="c_phone"></div>
    </div>
    <button class="btn btn-primary" id="saveContentBtn">Save content</button>
    <span class="save-note" id="contentSaveNote"></span>
  </section>

  <section class="panel" id="panel-photos">
    <div class="card">
      <h2>Hero photo</h2>
      <img class="photo-preview" id="heroPhotoPreview" src="" alt="">
      <input type="file" id="heroPhotoInput" accept="image/*" style="display:none;">
      <button class="btn btn-primary btn-sm" id="heroPhotoBtn" type="button">Upload new photo</button>
      <span class="save-note" id="heroPhotoNote"></span>
    </div>
  </section>

  <section class="panel" id="panel-products">
    <div class="card">
      <h2>Add a product</h2>
      <div class="row2">
        <div class="field"><label>Name</label><input id="p_name"></div>
        <div class="field"><label>Icon (emoji)</label><input id="p_icon" placeholder="🌾" maxlength="4"></div>
      </div>
      <div class="field"><label>Price (₹)</label><input id="p_price" type="number" min="0" step="1"></div>
      <div class="field"><label>Description</label><textarea id="p_desc" rows="2"></textarea></div>
      <button class="btn btn-primary btn-sm" id="addProductBtn">Add product</button>
      <span class="save-note" id="productAddNote"></span>
    </div>
    <div class="card"><h2>Products</h2><div id="productList"><div class="empty">Loading…</div></div></div>
  </section>

  <section class="panel" id="panel-customers">
    <div class="card">
      <h2>Log a customer</h2>
      <div class="row2">
        <div class="field"><label>Name</label><input id="cu_name"></div>
        <div class="field"><label>Email or phone</label><input id="cu_contact"></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="cu_notes" rows="2"></textarea></div>
      <button class="btn btn-primary btn-sm" id="addCustomerBtn">Add entry</button>
      <span class="save-note" id="customerAddNote"></span>
    </div>
    <div class="card">
      <h2>Customer &amp; contact-form log</h2>
      <div id="customerList"><div class="empty">Loading…</div></div>
    </div>
  </section>
  <section class="panel" id="panel-reports">
    <div class="card">
      <h2>Visitors</h2>
      <p class="muted" id="visitorSummary">Loading…</p>
      <div id="visitorList"></div>
    </div>
    <div class="card">
      <h2>Sales by product</h2>
      <div id="salesList"><div class="empty">No orders yet.</div></div>
    </div>
    <div class="card">
      <h2>Recent orders</h2>
      <div id="ordersList"><div class="empty">No orders yet.</div></div>
    </div>
  </section>
</main>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let token = localStorage.getItem('bb_admin_token') || null;
let contentDoc = {};

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function authHeaders(){ return { 'Content-Type':'application/json', 'Authorization': 'Bearer '+token }; }

async function api(path, opts={}){
  const res = await fetch(API+path, Object.assign({headers: authHeaders()}, opts));
  if (res.status === 401){ signOut(); throw new Error('unauthorized'); }
  if (!res.ok){ const b = await res.json().catch(()=>({})); throw new Error(b.error||'Request failed'); }
  return res.status === 204 ? null : res.json();
}

function signOut(){
  token = null; localStorage.removeItem('bb_admin_token');
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('gateScreen').style.display = 'flex';
}

document.getElementById('loginBtn').onclick = async () => {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try{
    const res = await fetch(API + '/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Sign in failed');
    token = data.token;
    localStorage.setItem('bb_admin_token', token);
    startApp();
  }catch(e){ errEl.textContent = e.message; }
};
document.getElementById('logoutBtn').onclick = signOut;

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
  };
});

async function startApp(){
  document.getElementById('gateScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  try{
    await loadContent();
    await loadProducts();
    await loadCustomers();
    await loadReports();
  }catch(e){ /* handled by api() */ }
}

// ---- REPORTS ----
async function loadReports(){
  try{
    const visits = await api('/api/analytics');
    const totalThisMonth = visits.reduce((s,v)=>s+v.count,0);
    const today = visits.find(v => new Date(v.day).toDateString() === new Date().toDateString());
    document.getElementById('visitorSummary').textContent =
      `Today: ${today ? today.count : 0} visits · Last 30 days: ${totalThisMonth} visits`;
    const list = document.getElementById('visitorList');
    list.innerHTML = '';
    visits.slice(-10).reverse().forEach(v => {
      const row = document.createElement('div'); row.className = 'item';
      row.innerHTML = `<div class="item-body"><div class="item-title">${new Date(v.day).toLocaleDateString()}</div></div><div class="item-sub">${v.count} visits</div>`;
      list.appendChild(row);
    });

    const orders = await api('/api/orders');
    const ordersList = document.getElementById('ordersList');
    if (!orders.length){ ordersList.innerHTML = '<div class="empty">No orders yet.</div>'; }
    else {
      ordersList.innerHTML = '';
      orders.slice(0,15).forEach(o => {
        const row = document.createElement('div'); row.className = 'item';
        const itemsText = (o.items||[]).map(i => `${i.name} ×${i.quantity}`).join(', ');
        row.innerHTML = `<div class="item-body"><div class="item-title">${esc(o.customer_name)} — ₹${Number(o.total).toFixed(0)}</div><div class="item-sub">${esc(itemsText)} · ${new Date(o.created_at).toLocaleString()}</div></div>`;
        ordersList.appendChild(row);
      });
    }

    const bySales = {};
    orders.forEach(o => (o.items||[]).forEach(i => {
      if (!bySales[i.name]) bySales[i.name] = { qty: 0, revenue: 0 };
      bySales[i.name].qty += Number(i.quantity)||0;
      bySales[i.name].revenue += (Number(i.price)||0) * (Number(i.quantity)||0);
    }));
    const salesList = document.getElementById('salesList');
    const names = Object.keys(bySales);
    if (!names.length){ salesList.innerHTML = '<div class="empty">No orders yet.</div>'; }
    else {
      salesList.innerHTML = '';
      names.sort((a,b) => bySales[b].revenue - bySales[a].revenue).forEach(name => {
        const row = document.createElement('div'); row.className = 'item';
        row.innerHTML = `<div class="item-body"><div class="item-title">${esc(name)}</div><div class="item-sub">${bySales[name].qty} sold</div></div><div class="item-sub">₹${bySales[name].revenue.toFixed(0)}</div>`;
        salesList.appendChild(row);
      });
    }
  }catch(e){ console.error(e); }
}

// ---- CONTENT ----
async function loadContent(){
  contentDoc = await api('/api/content');
  document.getElementById('c_badge').value = contentDoc.badge || '';
  document.getElementById('c_heading').value = contentDoc.heading || '';
  document.getElementById('c_lead').value = contentDoc.lead || '';
  document.getElementById('c_aboutHeading').value = contentDoc.aboutHeading || '';
  document.getElementById('c_aboutP1').value = contentDoc.aboutP1 || '';
  document.getElementById('c_aboutP2').value = contentDoc.aboutP2 || '';
  document.getElementById('c_location').value = contentDoc.location || '';
  document.getElementById('c_email').value = contentDoc.email || '';
  document.getElementById('c_phone').value = contentDoc.phone || '';
  renderTags();
  document.getElementById('heroPhotoPreview').src = contentDoc.heroImage || '';
}
function renderTags(){
  const wrap = document.getElementById('tagList');
  wrap.innerHTML = '';
  (contentDoc.tags||[]).forEach((tag, idx) => {
    const pill = document.createElement('span'); pill.className = 'tag-pill';
    const span = document.createElement('span'); span.textContent = tag;
    const rm = document.createElement('button'); rm.textContent = '×'; rm.type='button';
    rm.onclick = () => { contentDoc.tags.splice(idx,1); renderTags(); };
    pill.appendChild(span); pill.appendChild(rm); wrap.appendChild(pill);
  });
}
document.getElementById('addTagBtn').onclick = () => {
  const inp = document.getElementById('newTagInput'); const v = inp.value.trim();
  if (!v) return; contentDoc.tags = contentDoc.tags || []; contentDoc.tags.push(v); inp.value=''; renderTags();
};
document.getElementById('saveContentBtn').onclick = async () => {
  const payload = {
    badge: document.getElementById('c_badge').value,
    heading: document.getElementById('c_heading').value,
    lead: document.getElementById('c_lead').value,
    aboutHeading: document.getElementById('c_aboutHeading').value,
    aboutP1: document.getElementById('c_aboutP1').value,
    aboutP2: document.getElementById('c_aboutP2').value,
    location: document.getElementById('c_location').value,
    email: document.getElementById('c_email').value,
    phone: document.getElementById('c_phone').value,
    tags: contentDoc.tags || [],
  };
  try{
    contentDoc = await api('/api/content', { method:'PUT', body: JSON.stringify(payload) });
    document.getElementById('contentSaveNote').textContent = 'Saved ✓ — live now';
    toast('Content saved and live on your site');
    setTimeout(()=>document.getElementById('contentSaveNote').textContent='', 2500);
  }catch(e){ toast('Could not save: '+e.message); }
};

// ---- PHOTOS ----
document.getElementById('heroPhotoBtn').onclick = () => document.getElementById('heroPhotoInput').click();
document.getElementById('heroPhotoInput').onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  const note = document.getElementById('heroPhotoNote');
  note.textContent = 'Uploading…';
  try{
    const dataUri = await new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); });
    contentDoc = await api('/api/content', { method:'PUT', body: JSON.stringify({ heroImage: dataUri }) });
    document.getElementById('heroPhotoPreview').src = dataUri;
    note.textContent = 'Uploaded ✓ — live now';
    toast('Hero photo updated');
    setTimeout(()=>note.textContent='', 2500);
  }catch(err){ note.textContent = 'Upload failed: '+err.message; }
};

// ---- PRODUCTS ----
async function loadProducts(){
  const products = await api('/api/products');
  const wrap = document.getElementById('productList');
  if (!products.length){ wrap.innerHTML = '<div class="empty">No products yet.</div>'; return; }
  wrap.innerHTML = '';
  products.forEach(p => {
    const row = document.createElement('div'); row.className = 'item';
    row.innerHTML = `<div class="item-body"><div class="item-title">${esc(p.icon)} ${esc(p.name)} <span style="color:var(--chili);">₹${Number(p.price||0).toFixed(0)}</span></div><div class="item-sub">${esc(p.description)}</div></div>`;
    const del = document.createElement('button'); del.className='btn btn-danger btn-sm'; del.textContent='Delete';
    del.onclick = async () => { await api('/api/products/'+p.id, {method:'DELETE'}); toast('Product removed'); loadProducts(); };
    row.appendChild(del);
    wrap.appendChild(row);
  });
}
document.getElementById('addProductBtn').onclick = async () => {
  const name = document.getElementById('p_name').value.trim();
  const icon = document.getElementById('p_icon').value.trim() || '🌿';
  const description = document.getElementById('p_desc').value.trim();
  const price = parseFloat(document.getElementById('p_price').value) || 0;
  if (!name){ toast('Give the product a name'); return; }
  try{
    await api('/api/products', { method:'POST', body: JSON.stringify({name, icon, description, price}) });
    document.getElementById('p_name').value=''; document.getElementById('p_icon').value=''; document.getElementById('p_desc').value=''; document.getElementById('p_price').value='';
    document.getElementById('productAddNote').textContent = 'Added ✓';
    setTimeout(()=>document.getElementById('productAddNote').textContent='', 1800);
    loadProducts();
  }catch(e){ toast('Could not add: '+e.message); }
};

// ---- CUSTOMERS ----
async function loadCustomers(){
  const customers = await api('/api/customers');
  const wrap = document.getElementById('customerList');
  if (!customers.length){ wrap.innerHTML = '<div class="empty">No entries yet.</div>'; return; }
  wrap.innerHTML = '';
  customers.forEach(c => {
    const row = document.createElement('div'); row.className = 'item';
    const when = new Date(c.created_at).toLocaleDateString();
    row.innerHTML = `<div class="item-body"><div class="item-title">${esc(c.name)} <span style="font-weight:400;color:#8a7457;">· ${esc(c.source)} · ${when}</span></div><div class="item-sub">${esc(c.contact)}${c.message ? ' — '+esc(c.message) : ''}</div></div>`;
    const del = document.createElement('button'); del.className='btn btn-danger btn-sm'; del.textContent='Delete';
    del.onclick = async () => { await api('/api/customers/'+c.id, {method:'DELETE'}); toast('Entry removed'); loadCustomers(); };
    row.appendChild(del);
    wrap.appendChild(row);
  });
}
document.getElementById('addCustomerBtn').onclick = async () => {
  const name = document.getElementById('cu_name').value.trim();
  const contact = document.getElementById('cu_contact').value.trim();
  const message = document.getElementById('cu_notes').value.trim();
  if (!name){ toast('Add a name'); return; }
  try{
    await api('/api/customers', { method:'POST', body: JSON.stringify({name, contact, message}) });
    document.getElementById('cu_name').value=''; document.getElementById('cu_contact').value=''; document.getElementById('cu_notes').value='';
    document.getElementById('customerAddNote').textContent = 'Added ✓';
    setTimeout(()=>document.getElementById('customerAddNote').textContent='', 1800);
    loadCustomers();
  }catch(e){ toast('Could not add: '+e.message); }
};

if (token){ startApp(); } else { document.getElementById('gateScreen').style.display = 'flex'; }
</script>
</body>
</html>
